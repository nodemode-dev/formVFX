[package]
name = "fvx-core"
version = "0.39.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "formvfx's own compositing engine: project model, commands, renderer and effects, exposed to the formvfx engine service as a Python extension"
publish = false

[lib]
name = "fvx_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310", "extension-module"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rayon = "1.12"
parking_lot = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp"] }
tiny-skia = "0.12"
kurbo = "0.13"
rustybuzz = "0.20"
fontdb = "0.23"
i_overlay = "9.0.1"
usvg = { version = "0.48.1", default-features = false }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "gles", "vulkan", "wgsl"] }
exr = "1.74.2"
hayro = "0.8.0"
miniz_oxide = "0.8"
fancy-regex = "0.14"
wasmi = "1.1.0"
libloading = "0.8.9"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
